# 站点配置。换名字/换地址只改 site_name、site_url、repo_url 三行。
site_name: 知识库
site_description: 按学科组织的、可搜索的个人知识库
site_url: https://gh503.github.io/kb/
repo_url: https://github.com/gh503/kb
repo_name: gh503/kb
edit_uri: edit/main/docs/
copyright: 内容持续修订中

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      # 中文标题也能生成稳定锚点（默认 slugify 会丢掉非 ASCII 字符）
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

# 自动生成的每日归档不进 nav（由 订阅/index.md 链接过去），但也不能触发「漏进 nav」的警告
not_in_nav: |
  /订阅/2*.md
  /自然/*/*.md
  /人文/*/*.md
  /商业/*/*.md
  /日常/*/*.md
  /基础/*/*.md
  /工程/*/*.md
  /智能/*/*.md
  /网络/*/*.md

# 页面没进 nav 时报 WARN；配合 CI 的 --strict 就是硬错误，页面不会悄悄消失。
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - 首页: index.md
  - 基础:
      - 基础/index.md
      - 通用基础:
          - 基础/通用基础/index.md
      - 数学:
          - 基础/数学/index.md
      - 逻辑:
          - 基础/逻辑/index.md
  - 工程:
